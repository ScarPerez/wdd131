<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Product Review Form">
    <meta name="author" content="Scarlett Perez">

    <title>Product Review Form</title>

    <link rel="stylesheet" href="styles/form.css">

    <script src="scripts/form.js" defer></script>

</head>

<body>

<header>
    <h1>Product Review</h1>
</header>

<main>

    <form method="get" action="review.html">

        <!-- Product Name -->
        <div>
            <label for="product">Product Name</label>

            <select id="product" name="product" required>
                <option value="" disabled selected>
                    Select a Product ...
                </option>
            </select>
        </div>

        <!-- Overall Rating -->
        <fieldset>
            <legend>Overall Rating</legend>

            <input type="radio" id="star1" name="rating" value="1" required>
            <label for="star1">☆</label>

            <input type="radio" id="star2" name="rating" value="2">
            <label for="star2">☆☆</label>

            <input type="radio" id="star3" name="rating" value="3">
            <label for="star3">☆☆☆</label>

            <input type="radio" id="star4" name="rating" value="4">
            <label for="star4">☆☆☆☆</label>

            <input type="radio" id="star5" name="rating" value="5">
            <label for="star5">☆☆☆☆☆</label>
        </fieldset>

        <!-- Installation Date -->
        <div>
            <label for="installDate">Date of Installation</label>

            <input
                type="date"
                id="installDate"
                name="installDate"
                required>
        </div>

        <!-- Useful Features -->
        <fieldset>

            <legend>Useful Features</legend>

            <div>
                <input
                    type="checkbox"
                    id="durability"
                    name="features"
                    value="Durability">

                <label for="durability">Durability</label>
            </div>

            <div>
                <input
                    type="checkbox"
                    id="ease"
                    name="features"
                    value="Ease of Use">

                <label for="ease">Ease of Use</label>
            </div>

            <div>
                <input
                    type="checkbox"
                    id="performance"
                    name="features"
                    value="Performance">

                <label for="performance">Performance</label>
            </div>

            <div>
                <input
                    type="checkbox"
                    id="design"
                    name="features"
                    value="Design">

                <label for="design">Design</label>
            </div>

        </fieldset>

        <!-- Written Review -->
        <div>

            <label for="review">Written Review (Optional)</label>

            <textarea
                id="review"
                name="review"
                rows="6"></textarea>

        </div>

        <!-- User Name -->
        <div>

            <label for="username">Your Name (Optional)</label>

            <input
                type="text"
                id="username"
                name="username">

        </div>

        <!-- Submit Button -->
        <div>

            <input
                type="submit"
                value="Post Review">

        </div>

    </form>

</main>

<footer>

    <p>
        © <span id="currentyear"></span> 🌸 Scarlett Perez 🌸 Guatemala
    </p>

    <p id="lastModified"></p>

</footer>

</body>
</html>
